default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5433) %>
  username: <%= ENV.fetch("DB_USERNAME", "worktime_user") %>
  password: <%= ENV.fetch("DB_PASSWORD", "worktime_password") %>

development:
  <<: *default
  database: worktime_tracker_development

test:
  <<: *default
  database: worktime_tracker_test

production:
  primary:
    <<: *default
    database: worktime_tracker_production

  cache:
    <<: *default
    database: worktime_tracker_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    database: worktime_tracker_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: worktime_tracker_production_cable
    migrations_paths: db/cable_migrate